services:
  api:
    build:
      # Build context is the repo root so the api image can include scripts/
      # alongside api/app and api/data. See api/Dockerfile for the layout.
      context: ..
      dockerfile: api/Dockerfile
    container_name: bbrain-api
    env_file:
      - ../api/.env
    volumes:
      - chroma_data:/app/chroma
      # Bind-mount raw data so new sources can be added without rebuilding.
      # Files dropped into host's api/data/raw/ are immediately visible inside
      # the container at /app/data/raw/ (and /app/api/data/raw/ via symlink).
      - ../api/data/raw:/app/data/raw:ro
    # Bind to localhost only — host Caddy proxies to 127.0.0.1:8000
    ports:
      - "127.0.0.1:8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE: https://brain.clubduty.app/api
    container_name: bbrain-web
    # Bind to localhost only — host Caddy proxies to 127.0.0.1:3000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

# No caddy service — host's existing systemd Caddy serves all traffic.
# See infra/README.md for the host Caddyfile snippet.

volumes:
  chroma_data:
