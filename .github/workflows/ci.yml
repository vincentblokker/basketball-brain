name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache HuggingFace models (bge-m3 ~2GB)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-bge-m3-v1
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install deps
        run: |
          uv venv .venv
          source .venv/bin/activate
          uv pip install -e ".[dev]"

      - name: Ruff lint
        run: |
          source .venv/bin/activate
          ruff check app tests

      - name: Mypy type-check
        run: |
          source .venv/bin/activate
          mypy app

      - name: Pytest
        run: |
          source .venv/bin/activate
          pytest -v
        env:
          # Tests use mocks; an empty key suffices for OpenAI() init in non-mocked code paths
          OPENROUTER_API_KEY: ""

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install deps
        run: npm ci

      - name: Build (also performs TypeScript check)
        run: npm run build
        env:
          # Build uses inlined value; CI doesn't need real backend
          NEXT_PUBLIC_API_BASE: https://brain.clubduty.app/api
          NEXT_TELEMETRY_DISABLED: "1"
